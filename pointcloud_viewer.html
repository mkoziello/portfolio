<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point cloud viewer</title>
<style>
  :root {
    --ink:        #e2e8ef;
    --ink-dim:    #7d8b9c;
    --rule:       #29323d;
    --panel:      rgba(15, 19, 24, 0.86);
    --sand:       #d8b26a;
    --void:       #0b0e12;
    --mono: "Cascadia Code", "JetBrains Mono", ui-monospace, SFMono-Regular,
            Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--void);
    font-family: var(--mono);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  canvas { display: block; }

  /* ---------- launcher ---------- */

  #launch {
    position: fixed; top: 16px; left: 16px;
    width: 34px; height: 34px; padding: 0;
    display: grid; place-content: center;
    background: var(--panel); backdrop-filter: blur(14px);
    border: 1px solid var(--rule); color: var(--ink-dim);
    cursor: pointer; transition: color .15s, border-color .15s, opacity .15s;
  }
  #launch:hover { color: var(--ink); border-color: var(--ink-dim); }
  #launch:focus-visible { outline: 1px solid var(--sand); outline-offset: 2px; }
  body.panel-open #launch { opacity: 0; pointer-events: none; }

  #hint {
    position: fixed; top: 22px; left: 60px;
    font-size: 10px; letter-spacing: 0.08em; color: var(--ink-dim);
    background: var(--panel); backdrop-filter: blur(14px);
    border: 1px solid var(--rule); border-left: 1px solid var(--sand);
    padding: 6px 10px; max-width: 44ch;
    transition: opacity .3s;
  }
  #hint[hidden], body.panel-open #hint { display: none; }

  /* ---------- instrument panel ---------- */

  #panel {
    position: fixed; top: 16px; left: 16px; width: 292px;
    background: var(--panel);
    backdrop-filter: blur(14px);
    border: 1px solid var(--rule);
    font-size: 11px; line-height: 1.5;
    user-select: none;
    opacity: 0; visibility: hidden; transform: translateX(-6px);
    transition: opacity .16s ease, transform .16s ease, visibility 0s .16s;
  }
  #panel.open {
    opacity: 1; visibility: visible; transform: none;
    transition: opacity .16s ease, transform .16s ease;
  }

  #panel header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 9px 9px 14px;
    border-bottom: 1px solid var(--rule);
  }

  #panel h1 {
    margin: 0; font-size: 11px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
  }

  .head-right { display: flex; align-items: center; gap: 10px; }
  #fps { color: var(--ink-dim); font-variant-numeric: tabular-nums; font-size: 10px; }

  #close {
    width: 20px; height: 20px; padding: 0; border: 0; background: none;
    color: var(--ink-dim); cursor: pointer; font-size: 13px; line-height: 1;
  }
  #close:hover { color: var(--ink); }

  .block { padding: 12px 14px; border-bottom: 1px solid var(--rule); }
  .block:last-child { border-bottom: 0; }

  .readout { display: flex; justify-content: space-between; gap: 12px; }
  .readout + .readout { margin-top: 3px; }
  .readout dt { color: var(--ink-dim); letter-spacing: 0.06em; }
  .readout dd {
    margin: 0; font-variant-numeric: tabular-nums;
    text-align: right; overflow: hidden; text-overflow: ellipsis;
  }
  dl { margin: 0; }

  .label {
    display: flex; justify-content: space-between; align-items: baseline;
    color: var(--ink-dim); letter-spacing: 0.1em; text-transform: uppercase;
    font-size: 10px; margin-bottom: 9px;
  }
  .label b {
    color: var(--ink); font-weight: 500; letter-spacing: 0;
    text-transform: none; font-variant-numeric: tabular-nums;
  }

  /* ---------- dataset slots ---------- */

  #slots { padding: 6px 0; }
  .slot {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 6px 14px; border: 0; background: none;
    font: inherit; font-size: 11px; color: var(--ink-dim);
    cursor: pointer; text-align: left;
  }
  .slot:hover { color: var(--ink); background: rgba(255,255,255,0.03); }
  .slot:focus-visible { outline: 1px solid var(--sand); outline-offset: -2px; }
  .slot[aria-current="true"] { color: var(--ink); }
  .slot[aria-current="true"] .idx { color: var(--sand); }

  .idx { font-variant-numeric: tabular-nums; letter-spacing: 0.06em; opacity: 0.75; }
  .slot .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .tag { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.6; }
  .dot { width: 5px; height: 5px; flex: 0 0 5px; border: 1px solid var(--ink-dim); }
  .slot[data-state="ready"] .dot { background: var(--sand); border-color: var(--sand); }
  .slot[data-state="loading"] .dot { background: var(--ink-dim); }

  /* ---------- size slider with spacing tick ---------- */

  .track { position: relative; padding-bottom: 15px; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 15px; margin: 0; background: transparent;
    display: block; cursor: ew-resize;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--rule); }
  input[type=range]::-moz-range-track { height: 1px; background: var(--rule); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 3px; height: 15px; margin-top: -7px;
    background: var(--sand); border: 0; border-radius: 0;
  }
  input[type=range]::-moz-range-thumb {
    width: 3px; height: 15px; background: var(--sand); border: 0; border-radius: 0;
  }
  input[type=range]:focus-visible { outline: 1px solid var(--sand); outline-offset: 3px; }

  #tick {
    position: absolute; bottom: 0; width: 1px; height: 11px;
    background: var(--ink-dim); pointer-events: none;
  }
  #tick::after {
    content: "spacing"; position: absolute; bottom: -2px; left: 5px;
    font-size: 9px; color: var(--ink-dim); letter-spacing: 0.08em; white-space: nowrap;
  }

  .toggles { display: flex; flex-wrap: wrap; gap: 6px; }
  .toggles label {
    flex: 1 1 auto; text-align: center;
    padding: 6px 8px; border: 1px solid var(--rule);
    color: var(--ink-dim); cursor: pointer;
    letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px;
    white-space: nowrap;
  }
  .toggles input { position: absolute; opacity: 0; pointer-events: none; }
  .toggles label:hover { color: var(--ink); }
  .toggles label:has(input:checked) {
    background: var(--sand); border-color: var(--sand); color: var(--void);
  }
  .toggles label:has(input:focus-visible) { outline: 1px solid var(--sand); outline-offset: 2px; }

  .actions { display: flex; gap: 6px; }
  button.ghost {
    flex: 1; font: inherit; font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 7px 8px; cursor: pointer;
    background: transparent; color: var(--ink-dim);
    border: 1px solid var(--rule);
  }
  button.ghost:hover { color: var(--ink); border-color: var(--ink-dim); }
  button.ghost:focus-visible { outline: 1px solid var(--sand); outline-offset: 2px; }

  body.dragging::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    outline: 1px dashed var(--sand); outline-offset: -14px;
  }

  @media (prefers-reduced-motion: reduce) {
    #panel, #panel.open, #launch, #hint { transition: none; }
  }

  @media (max-width: 560px) {
    #panel { left: 8px; right: 8px; top: 8px; width: auto; }
    #launch { top: 8px; left: 8px; }
    #hint { display: none; }
  }
</style>
</head>
<body>

<button id="launch" aria-label="Open controls" title="Controls">
  <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor"
       stroke-width="1.2" aria-hidden="true">
    <path d="M1 3.5h13M1 7.5h13M1 11.5h13"/>
    <circle cx="4.5" cy="3.5" r="1.6" fill="var(--void)"/>
    <circle cx="10" cy="7.5" r="1.6" fill="var(--void)"/>
    <circle cx="6" cy="11.5" r="1.6" fill="var(--void)"/>
  </svg>
</button>

<div id="hint" hidden></div>

<div id="panel">
  <header>
    <h1>Point cloud</h1>
    <div class="head-right">
      <span id="fps">— fps</span>
      <button id="close" aria-label="Close controls">✕</button>
    </div>
  </header>

  <div id="slots"></div>

  <div class="block">
    <dl>
      <div class="readout"><dt>Points</dt><dd id="r-count">—</dd></div>
      <div class="readout"><dt>Extent</dt><dd id="r-extent">—</dd></div>
      <div class="readout"><dt>Spacing</dt><dd id="r-spacing">—</dd></div>
    </dl>
  </div>

  <div class="block">
    <div class="label">Point size <b id="v-size">—</b></div>
    <div class="track">
      <input id="size" type="range" min="0" max="1000" value="500" aria-label="Point size">
      <div id="tick"></div>
    </div>
  </div>

  <div class="block">
    <div class="label">Brightness <b id="v-bright">1.00</b></div>
    <input id="bright" type="range" min="20" max="300" value="100" aria-label="Brightness">
  </div>

  <div class="block toggles">
    <label><input type="checkbox" id="atten" checked><span>Perspective</span></label>
    <label><input type="checkbox" id="shade" checked><span>Round</span></label>
    <label><input type="checkbox" id="light"><span>Light bg</span></label>
  </div>

  <div class="block actions">
    <button class="ghost" id="reset">Reset view</button>
    <button class="ghost" id="open">Load into slot</button>
  </div>
</div>

<input id="file" type="file" accept=".pcld,.bin" hidden>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================== *
 * Datasets — edit this list. A slot with no file, or one whose file
 * is missing, falls back to generated placeholder geometry.
 * ================================================================== */

const BASE = 'pointcloud/';   // folder holding the .pcld files

const DATASETS = [
  { name: 'Giewont', url: 'giewont.pcld' },
  { name: 'Cloud 1', url: 'cloud1.pcld' },
  { name: 'Cloud 2', url: 'cloud2.pcld' },
  { name: 'Cloud 3', url: 'cloud3.pcld' },
];

const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ------------------------------------------------------------------ *
 * .pcld container, written by export_pointcloud.py
 * ------------------------------------------------------------------ */

function parsePCLD(buffer) {
  const dv = new DataView(buffer);
  const magic = String.fromCharCode(dv.getUint8(0), dv.getUint8(1),
                                    dv.getUint8(2), dv.getUint8(3));
  if (magic !== 'PCLD') throw new Error('Not a .pcld file (bad signature).');

  const version = dv.getUint32(4, true);
  if (version !== 1) throw new Error(`Unsupported .pcld version ${version}.`);

  const count = dv.getUint32(8, true);
  const flags = dv.getUint32(12, true);
  const quantised = (flags & 1) !== 0;
  const hasColor  = (flags & 2) !== 0;

  const f3 = o => [dv.getFloat32(o, true), dv.getFloat32(o + 4, true),
                   dv.getFloat32(o + 8, true)];
  const center = f3(16), scale = f3(28), half = f3(40);

  let off = 52;
  let positions;

  if (quantised) {
    const q = new Int16Array(buffer, off, count * 3);
    off += count * 6;
    positions = new Float32Array(count * 3);
    for (let i = 0; i < count * 3; i += 3) {
      positions[i]     = q[i]     * scale[0];
      positions[i + 1] = q[i + 1] * scale[1];
      positions[i + 2] = q[i + 2] * scale[2];
    }
  } else {
    positions = new Float32Array(buffer.slice(off, off + count * 12));
    off += count * 12;
  }

  const colors = hasColor
    ? new Uint8Array(buffer.slice(off, off + count * 3))
    : new Uint8Array(count * 3).fill(200);

  return { count, positions, colors, center, half, placeholder: false };
}

/* ------------------------------------------------------------------ *
 * Placeholder cloud — a synthetic terrestrial scan so the viewer has
 * something to show before the real exports exist. Sampled in polar
 * coordinates from a scanner at the origin, so it thins out with
 * distance and drops a shadow behind the building, like the real thing.
 * ------------------------------------------------------------------ */

function makePlaceholder(seed = 1, total = 240000) {
  let s = seed >>> 0;
  const rnd = () => {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  const pos = new Float32Array(total * 3);
  const col = new Uint8Array(total * 3);
  let n = 0;

  const put = (x, y, z, r, g, b) => {
    pos[n * 3] = x; pos[n * 3 + 1] = y; pos[n * 3 + 2] = z;
    col[n * 3] = r; col[n * 3 + 1] = g; col[n * 3 + 2] = b;
    n++;
  };

  const RANGE = 42;
  const ground = (x, y) =>
    1.1 * Math.sin(x * 0.08) * Math.cos(y * 0.07) +
    0.5 * Math.sin(x * 0.19 + 1.3) * Math.cos(y * 0.17 - 0.4) +
    0.2 * Math.sin(x * 0.44) * Math.cos(y * 0.38);

  // Building footprint, used both to place walls and to cast the shadow.
  const bx = 13, by = 9, bw = 5.5, bd = 4, bh = 6.5;
  const shadowed = (x, y) => {
    const d = Math.hypot(x, y);
    const t = Math.hypot(bx, by) / d;
    if (t >= 1) return false;                       // in front of the building
    return Math.abs(x * t - bx) < bw && Math.abs(y * t - by) < bd;
  };

  // --- ground, scanner-density sampling -----------------------------
  const nGround = Math.floor(total * 0.62);
  for (let i = 0; i < nGround; i++) {
    const th = rnd() * Math.PI * 2;
    const r = 1.5 + Math.pow(rnd(), 0.65) * RANGE;
    const x = Math.cos(th) * r, y = Math.sin(th) * r;
    if (shadowed(x, y)) continue;
    const z = ground(x, y);
    const grass = 0.5 + 0.5 * Math.sin(x * 0.3 + y * 0.21);
    const v = 0.82 + rnd() * 0.36;
    put(x, y, z,
        clamp8((92 + grass * 34) * v),
        clamp8((88 + grass * 46) * v),
        clamp8((66 + grass * 18) * v));
  }

  // --- building: three visible walls + flat roof --------------------
  const nWall = Math.floor(total * 0.24);
  for (let i = 0; i < nWall; i++) {
    const face = rnd();
    let x, y;
    if (face < 0.4)      { x = bx + (rnd() * 2 - 1) * bw; y = by - bd; }
    else if (face < 0.8) { x = bx - bw; y = by + (rnd() * 2 - 1) * bd; }
    else                 { x = bx + (rnd() * 2 - 1) * bw; y = by + (rnd() * 2 - 1) * bd; }

    const roof = face >= 0.8;
    const z = roof ? bh + ground(bx, by) + rnd() * 0.05
                   : ground(x, y) + rnd() * bh;

    // Window bands, so the walls read as a structure rather than noise.
    const band = !roof && (z % 2.6) > 1.5 && (z % 2.6) < 2.3;
    const v = 0.86 + rnd() * 0.3;
    if (band) put(x, y, z, clamp8(58 * v), clamp8(68 * v), clamp8(82 * v));
    else if (roof) put(x, y, z, clamp8(96 * v), clamp8(94 * v), clamp8(90 * v));
    else put(x, y, z, clamp8(168 * v), clamp8(160 * v), clamp8(146 * v));
  }

  // --- a few trees --------------------------------------------------
  const trees = [[-14, 6], [-8, -17], [7, -13], [22, -4], [-24, -8]];
  const perTree = Math.floor((total - n) / trees.length);
  for (const [tx, ty] of trees) {
    const base = ground(tx, ty), h = 3.4 + rnd() * 2.2, rad = 1.8 + rnd() * 1.1;
    for (let i = 0; i < perTree; i++) {
      if (rnd() < 0.18) {                            // trunk
        const a = rnd() * Math.PI * 2;
        put(tx + Math.cos(a) * 0.18, ty + Math.sin(a) * 0.18,
            base + rnd() * h, 74, 58, 44);
      } else {                                       // canopy
        const a = rnd() * Math.PI * 2, b = Math.acos(rnd() * 2 - 1);
        const rr = rad * Math.cbrt(rnd());
        const v = 0.7 + rnd() * 0.5;
        put(tx + rr * Math.sin(b) * Math.cos(a),
            ty + rr * Math.sin(b) * Math.sin(a),
            base + h + rr * Math.cos(b) * 0.8,
            clamp8(62 * v), clamp8(96 * v), clamp8(52 * v));
      }
    }
  }

  // --- centre and measure -------------------------------------------
  const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  for (let i = 0; i < n * 3; i++) {
    const a = i % 3;
    if (pos[i] < lo[a]) lo[a] = pos[i];
    if (pos[i] > hi[a]) hi[a] = pos[i];
  }
  const center = lo.map((v, i) => (v + hi[i]) / 2);
  const half = hi.map((v, i) => Math.max((v - lo[i]) / 2, 1e-6));
  for (let i = 0; i < n * 3; i++) pos[i] -= center[i % 3];

  return {
    count: n,
    positions: pos.subarray(0, n * 3),
    colors: col.subarray(0, n * 3),
    center, half, placeholder: true,
  };
}

const clamp8 = v => Math.max(0, Math.min(255, v | 0));

/* ------------------------------------------------------------------ *
 * Scene
 * ------------------------------------------------------------------ */

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e12);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
camera.up.set(0, 0, 1);   // Blender is Z-up; keep orbiting intuitive

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = !reduceMotion;
controls.dampingFactor = 0.08;
controls.zoomToCursor = true;

const uniforms = {
  uSize:       { value: 0.02 },   // world-space diameter
  uFocal:      { value: 500 },    // device pixels per unit at unit distance
  uAttenuate:  { value: 1 },
  uFrozenDist: { value: 10 },
  uBrightness: { value: 1 },
  uShade:      { value: 1 },
};

const material = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: /* glsl */`
    attribute vec3 color;
    uniform float uSize, uFocal, uAttenuate, uFrozenDist;
    varying vec3 vColor;
    void main() {
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float dist = mix(uFrozenDist, -mv.z, uAttenuate);
      gl_PointSize = clamp(uSize * uFocal / max(dist, 1e-4), 1.0, 128.0);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform float uBrightness, uShade;
    varying vec3 vColor;
    vec3 srgbToLinear(vec3 c) {
      return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)),
                 step(vec3(0.04045), c));
    }
    void main() {
      vec2 pc = gl_PointCoord * 2.0 - 1.0;
      float r2 = dot(pc, pc);
      if (r2 > 1.0) discard;
      float dome = 0.45 + 0.55 * sqrt(max(1.0 - r2, 0.0));
      vec3 c = srgbToLinear(vColor) * uBrightness * mix(1.0, dome, uShade);
      gl_FragColor = vec4(c, 1.0);
      #include <colorspace_fragment>
    }`,
});

let cloud = null;
let spacing = 1, diagonal = 1, sizeInitialised = false;

function updateFocal() {
  // gl_PointSize is in device pixels, so measure against the draw buffer.
  const h = renderer.domElement.height;
  uniforms.uFocal.value = h / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}

function show(data) {
  if (cloud) { cloud.geometry.dispose(); scene.remove(cloud); }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(data.positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(data.colors, 3, true));

  const [hx, hy, hz] = data.half;
  geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(), Math.hypot(hx, hy, hz));

  cloud = new THREE.Points(geometry, material);
  cloud.frustumCulled = false;
  scene.add(cloud);

  // Estimated point spacing: LiDAR sits on surfaces, so treat the two
  // largest extents as an area and divide it between the points.
  const ext = [hx * 2, hy * 2, hz * 2].sort((a, b) => b - a);
  spacing = Math.sqrt((ext[0] * ext[1]) / data.count);
  diagonal = Math.hypot(hx, hy, hz) * 2;

  camera.near = diagonal / 5000;
  camera.far = diagonal * 20;
  resetView();

  $('r-count').textContent = data.count.toLocaleString();
  $('r-extent').textContent = ext.map(fmt).join(' × ');
  $('r-spacing').textContent = fmt(spacing);

  // Keep the slider where the user put it — it reads in multiples of
  // spacing, so it stays meaningful across datasets of different density.
  if (!sizeInitialised) {
    $('size').value = String(sizeToSlider(spacing * 1.4));
    sizeInitialised = true;
  }
  applySize();
  $('tick').style.left = `${sizeToSlider(spacing) / 10}%`;
}

function resetView() {
  const d = diagonal * 0.85;
  camera.position.set(d * 0.55, -d * 0.8, d * 0.45);
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.update();
  uniforms.uFrozenDist.value = camera.position.length();
}

/* ------------------------------------------------------------------ *
 * Slots
 * ------------------------------------------------------------------ */

const slots = DATASETS.map((d, i) => ({ ...d, index: i, data: null, state: 'empty' }));
let active = 0;

// Files sometimes land without the extension, so try both spellings.
// A missing file falls through to the next candidate; a file that IS
// there but won't parse throws, so you see the real reason.
async function fetchCloud(name) {
  const stem = name.replace(/\.pcld$/i, '');
  let last = new Error(`${BASE}${name} not found`);

  for (const candidate of [`${stem}.pcld`, stem]) {
    let res;
    try {
      res = await fetch(BASE + candidate);
    } catch {
      last = new Error(`Can't reach ${BASE}${candidate} — serve this page over http`);
      continue;
    }
    if (!res.ok) {
      last = new Error(`${BASE}${candidate} — HTTP ${res.status}`);
      continue;
    }
    return parsePCLD(await res.arrayBuffer());
  }
  throw last;
}

function renderSlots() {
  $('slots').innerHTML = '';
  for (const slot of slots) {
    const el = document.createElement('button');
    el.className = 'slot';
    el.dataset.state = slot.state;
    el.setAttribute('aria-current', String(slot.index === active));
    el.innerHTML =
      `<span class="idx">${String(slot.index + 1).padStart(2, '0')}</span>` +
      `<span class="name"></span>` +
      `<span class="tag"></span><span class="dot"></span>`;
    el.querySelector('.name').textContent = slot.name;
    el.querySelector('.tag').textContent =
      slot.state === 'loading' ? 'loading' :
      slot.data?.placeholder ? 'sample' :
      slot.state === 'ready' ? `${Math.round(slot.data.count / 1000)}k` : '';
    el.addEventListener('click', () => select(slot.index));
    $('slots').appendChild(el);
  }
}

async function select(i) {
  active = i;
  const slot = slots[i];
  renderSlots();

  if (slot.data) { show(slot.data); return; }

  slot.state = 'loading';
  renderSlots();

  let data, note = '';
  if (slot.url) {
    try {
      data = await fetchCloud(slot.url);
    } catch (err) {
      data = makePlaceholder(i + 1);
      note = `${err.message} — showing sample geometry instead.`;
    }
  } else {
    data = makePlaceholder(i + 1);
  }

  slot.data = data;
  slot.state = 'ready';
  renderSlots();
  if (active === i) { show(data); if (note) hint(note); }
}

let hintTimer;
function hint(text) {
  const el = $('hint');
  el.textContent = text;
  el.hidden = false;
  el.style.opacity = '1';
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => {
    el.style.opacity = '0';
    setTimeout(() => { el.hidden = true; }, 300);
  }, 6000);
}

/* ------------------------------------------------------------------ *
 * Panel + controls
 * ------------------------------------------------------------------ */

function setPanel(open) {
  $('panel').classList.toggle('open', open);
  document.body.classList.toggle('panel-open', open);
  if (open) $('close').focus(); else $('launch').focus();
}

$('launch').addEventListener('click', () => setPanel(true));
$('close').addEventListener('click', () => setPanel(false));
addEventListener('keydown', e => {
  if (e.key === 'Escape') setPanel(false);
  if (e.key === 'r' || e.key === 'R') resetView();
});

// Slider runs from 1/10 to 12× the estimated spacing, logarithmically,
// so the useful range sits in the middle of the travel.
const LO = Math.log(0.1), HI = Math.log(12);
const sliderToSize = t => spacing * Math.exp(LO + (HI - LO) * (t / 1000));
const sizeToSlider = s => 1000 * (Math.log(s / spacing) - LO) / (HI - LO);

function fmt(v) {
  if (!isFinite(v)) return '—';
  const abs = Math.abs(v);
  const dp = abs >= 100 ? 0 : abs >= 10 ? 1 : abs >= 1 ? 2 : abs >= 0.1 ? 3 : 4;
  return v.toFixed(dp);
}

function applySize() {
  const size = sliderToSize(+$('size').value);
  uniforms.uSize.value = size;
  $('v-size').textContent = `${fmt(size)} u · ${(size / spacing).toFixed(2)}× sp`;
}

$('size').addEventListener('input', applySize);

$('bright').addEventListener('input', e => {
  uniforms.uBrightness.value = e.target.value / 100;
  $('v-bright').textContent = (e.target.value / 100).toFixed(2);
});

$('atten').addEventListener('change', e => {
  // Freeze the current viewing distance so sizes don't jump on toggle.
  if (!e.target.checked) {
    uniforms.uFrozenDist.value = camera.position.distanceTo(controls.target);
  }
  uniforms.uAttenuate.value = e.target.checked ? 1 : 0;
});

$('shade').addEventListener('change', e => uniforms.uShade.value = e.target.checked ? 1 : 0);
$('light').addEventListener('change', e => scene.background.set(e.target.checked ? 0xe8e6e1 : 0x0b0e12));
$('reset').addEventListener('click', resetView);
$('open').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => e.target.files[0] && loadBlob(e.target.files[0]));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  updateFocal();
});

/* ------------------------------------------------------------------ *
 * Drag and drop — replaces whichever slot is active
 * ------------------------------------------------------------------ */

async function loadBlob(file) {
  try {
    const data = parsePCLD(await file.arrayBuffer());
    Object.assign(slots[active], { data, state: 'ready', name: file.name.replace(/\.pcld$/i, '') });
    renderSlots();
    show(data);
  } catch (err) {
    hint(err.message);
  }
}

['dragenter', 'dragover'].forEach(t => addEventListener(t, e => {
  e.preventDefault();
  document.body.classList.add('dragging');
}));
addEventListener('dragleave', e => {
  if (e.target === document.documentElement) document.body.classList.remove('dragging');
});
addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('dragging');
  if (e.dataTransfer.files[0]) loadBlob(e.dataTransfer.files[0]);
});

/* ------------------------------------------------------------------ *
 * Go
 * ------------------------------------------------------------------ */

updateFocal();
renderSlots();
select(0);

let frames = 0, last = performance.now();
renderer.setAnimationLoop(now => {
  controls.update();
  renderer.render(scene, camera);
  if (++frames >= 20) {
    $('fps').textContent = `${Math.round(frames * 1000 / (now - last))} fps`;
    frames = 0; last = now;
  }
});
</script>
</body>
</html>
