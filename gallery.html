<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — VertexVoodoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --view:#1e2124; --panel:#2a2e32; --head:#31363b; --line:#3f4448;
    --txt:#fcfcfc; --dim:#a1a9b1; --acc:#3daee9; --red:#da4453;
    --cream:#E4DCC9; --brand:#191512;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--view);color:var(--txt);
    font-family:"Noto Sans",system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased;}
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
  .mono{font-family:"Noto Sans Mono",monospace;}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:3px;}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#4b5157;border-radius:6px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--acc);border:3px solid transparent;background-clip:content-box}

  #app{display:grid;grid-template-columns:248px 1fr;height:100%;
    transition:grid-template-columns .22s cubic-bezier(.2,.8,.3,1);}
  #app.collapsed{grid-template-columns:0 1fr;}
  #app.collapsed #side{overflow:hidden;border-right-color:transparent;}

  /* ---------------- tree ---------------- */
  #side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
  #side h2{margin:0;padding:12px 14px 10px;font-size:10.5px;font-weight:700;letter-spacing:.11em;
    text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:8px;}
  #side h2 span{margin-left:auto;font-family:"Noto Sans Mono",monospace;font-size:9.5px;color:#6c757c;}
  #tree{flex:1;overflow-y:auto;padding:7px 6px 16px;}
  .node{display:block;}
  .row{display:flex;align-items:center;gap:6px;width:100%;padding:6px 8px;border-radius:5px;
    text-align:left;font-size:12.5px;color:#d5dade;transition:background .12s;}
  .row:hover{background:rgba(255,255,255,.06);}
  .row.on{background:rgba(61,174,233,.22);color:#fff;}
  .row .car{width:12px;flex-shrink:0;font-size:8px;color:#7d858c;transition:transform .16s;text-align:center;}
  .row .car.leaf{opacity:0;}
  .node.closed > .row .car{transform:rotate(-90deg);}
  .row .fi{width:15px;height:15px;flex-shrink:0;opacity:.85;}
  .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .ct{font-family:"Noto Sans Mono",monospace;font-size:9.5px;color:#6c757c;flex-shrink:0;}
  .row.on .ct{color:#cbe7f7;}
  .kids{margin-left:13px;border-left:1px solid rgba(255,255,255,.07);padding-left:3px;}
  .node.closed > .kids{display:none;}

  /* ---------------- main ---------------- */
  #main{display:flex;flex-direction:column;min-width:0;min-height:0;}
  #bar{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:11px 16px;
    border-bottom:1px solid var(--line);background:rgba(42,46,50,.5);}
  #crumb{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:12.5px;}
  #crumb button{color:var(--dim);}
  #crumb button:hover{color:var(--acc);text-decoration:underline;}
  #crumb b{font-weight:600;}
  #crumb i{color:#5b6167;font-style:normal;}
  #count{flex-shrink:0;font-family:"Noto Sans Mono",monospace;font-size:10.5px;color:var(--dim);}
  #side-toggle{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;flex-shrink:0;
    background:#33383d;border:1px solid rgba(255,255,255,.08);color:#c3c9ce;
    transition:background .13s,color .13s,border-color .13s;}
  #side-toggle:hover{background:#3d444a;color:#fff;}
  #side-toggle.off{color:var(--acc);border-color:rgba(61,174,233,.45);}
  #side-toggle svg{width:15px;height:15px;}

  #grid-wrap{flex:1;overflow-y:auto;padding:16px;}
  #folders{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  #folders:empty{display:none;}
  .fcard{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:7px;background:#262b30;
    border:1px solid rgba(255,255,255,.07);font-size:12.5px;transition:border-color .14s,transform .14s;}
  .fcard:hover{border-color:var(--acc);transform:translateY(-1px);}
  .fcard svg{width:15px;height:15px;flex-shrink:0;}
  .fcard span{font-family:"Noto Sans Mono",monospace;font-size:10px;color:#6c757c;}

  #grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}
  .tile{position:relative;display:block;width:100%;padding:0;border-radius:8px;overflow:hidden;
    background:#181b1e;border:1px solid rgba(255,255,255,.07);aspect-ratio:4/3;
    transition:border-color .15s,transform .15s;}
  .tile:hover{border-color:var(--acc);transform:translateY(-2px);}
  .tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block;background:#111;}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 9px 7px;font-size:11px;
    text-align:left;color:#eef1f3;background:linear-gradient(transparent,rgba(0,0,0,.85));
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tile .badge{position:absolute;top:7px;right:7px;display:flex;align-items:center;gap:4px;
    padding:3px 7px;border-radius:5px;background:rgba(10,12,14,.75);font-family:"Noto Sans Mono",monospace;
    font-size:9.5px;color:#dfe3e6;}
  .tile .badge svg{width:9px;height:9px;}
  .tile .broken{position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center;
    font-size:11px;color:#8a929a;font-family:"Noto Sans Mono",monospace;}

  /* ---------------- empty / error ---------------- */
  #msg{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    padding:32px;text-align:center;}
  #msg.show{display:flex;}
  #msg h3{margin:0;font-size:15px;font-weight:600;}
  #msg p{margin:0;max-width:52ch;font-size:12.5px;line-height:1.75;color:var(--dim);}
  #msg .code{font-family:"Noto Sans Mono",monospace;font-size:11.5px;line-height:1.7;background:#171a1d;
    border:1px solid var(--line);border-radius:6px;padding:11px 14px;color:#cfd4d8;
    white-space:pre;overflow-x:auto;text-align:left;max-width:100%;}

  /* ---------------- lightbox ---------------- */
  #lb{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:rgba(10,11,13,.94);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  #lb.open{display:flex;}
  #lb-bar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:12px 16px;}
  #lb-name{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #lb-name small{display:block;font-family:"Noto Sans Mono",monospace;font-size:10.5px;color:var(--dim);}
  #lb-bar .n{font-family:"Noto Sans Mono",monospace;font-size:11px;color:var(--dim);flex-shrink:0;}
  #lb-bar button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#c3c9ce;
    flex-shrink:0;transition:background .13s,color .13s;}
  #lb-bar button:hover{background:rgba(255,255,255,.12);color:#fff;}
  #lb-bar button.x:hover{background:var(--red);color:#fff;}
  #lb-bar svg{width:14px;height:14px;}
  #lb-stage{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;
    padding:0 16px 18px;overflow:hidden;}
  #lb-stage img,#lb-stage video{max-width:100%;max-height:100%;width:auto;height:auto;
    object-fit:contain;display:block;border-radius:6px;
    background:#000;box-shadow:0 20px 60px rgba(0,0,0,.6);}
  #lb-nav{position:absolute;inset:0;pointer-events:none;}
  #lb-nav button{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;
    border-radius:8px;background:rgba(20,23,26,.7);color:#dfe3e6;display:grid;place-items:center;
    pointer-events:auto;transition:background .14s;}
  #lb-nav button:hover{background:var(--acc);color:#0d1a20;}
  #lb-nav .prev{left:12px;} #lb-nav .next{right:12px;}
  #lb-nav svg{width:16px;height:16px;}

  @media (max-width:760px){
    #app{grid-template-columns:1fr;}
    #side{position:fixed;inset:0 auto 0 0;width:min(280px,84vw);z-index:60;transform:translateX(-100%);
      transition:transform .22s cubic-bezier(.2,.8,.3,1);box-shadow:0 0 40px rgba(0,0,0,.6);}
    #side.open{transform:none;}
    #scrim{position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.5);display:none;}
    #scrim.on{display:block;}
    #grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
    #grid-wrap{padding:12px;}
    #lb-nav button{width:38px;height:54px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;}}
</style>
</head>
<body>

<div id="app">
  <aside id="side">
    <h2>Gallery <span id="tree-count">—</span></h2>
    <div id="tree"></div>
  </aside>

  <main id="main">
    <div id="bar">
      <button id="side-toggle" aria-label="Toggle folders" title="Folders" aria-expanded="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div id="crumb"></div>
      <div id="count"></div>
    </div>
    <div id="grid-wrap">
      <div id="folders"></div>
      <div id="grid"></div>
    </div>
    <div id="msg"></div>
  </main>
</div>
<div id="scrim"></div>

<div id="lb" role="dialog" aria-modal="true" aria-label="Media viewer">
  <div id="lb-bar">
    <div id="lb-name"></div>
    <span class="n" id="lb-n"></span>
    <button id="lb-open" title="Open in a new tab" aria-label="Open in a new tab">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 5h10v10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 5 5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button id="lb-close" class="x" title="Close (Esc)" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="lb-stage"></div>
  <div id="lb-nav">
    <button class="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none"><path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none"><path d="m9 5 7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<script>
/* ============================================================
   The folder tree comes from Gallery/gallery.json, which
   tools/build_gallery.py writes by walking the Gallery folder.
   Re-run it whenever you add or remove files:
       python3 tools/build_gallery.py
   ============================================================ */
const GALLERY_DIR = 'Gallery';
const MANIFEST    = GALLERY_DIR + '/gallery.json';

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const url = p => GALLERY_DIR + '/' + p.split('/').map(encodeURIComponent).join('/');

const ICON = {
  folder:`<svg viewBox="0 0 24 24" fill="none"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.4h7A1.5 1.5 0 0 1 19 9.9V18a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 3 18z" stroke="#f6a04d" stroke-width="1.7" stroke-linejoin="round"/></svg>`,
  open:`<svg viewBox="0 0 24 24" fill="none"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.4h7A1.5 1.5 0 0 1 19 9.9v1.1H6.4L3 18z" stroke="#f6a04d" stroke-width="1.7" stroke-linejoin="round"/><path d="M6.4 11H21l-3 8.5H4.5z" stroke="#f6a04d" stroke-width="1.7" stroke-linejoin="round"/></svg>`,
  play:`<svg viewBox="0 0 24 24" fill="none"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>`
};

let ROOT=null, CUR=null, LIST=[], IDX=0;

/* ---------------- load ---------------- */
(async function init(){
  try{
    const res = await fetch(MANIFEST, {cache:'no-store'});
    if(!res.ok) throw new Error(`${MANIFEST} — HTTP ${res.status}`);
    const data = await res.json();
    ROOT = normalise(data.root || data);
    if(!ROOT) throw new Error('The manifest has no root folder.');
    buildTree();
    open(ROOT);
  }catch(err){
    showMessage(err);
  }
})();

/* tolerate a hand-written manifest: fill in the gaps */
function normalise(node, path=''){
  if(!node || typeof node!=='object') return null;
  const n = {
    name: node.name || 'Gallery',
    path: node.path!=null ? node.path : path,
    files: (node.files||[]).map(f=>{
      const p = f.path || ((node.path? node.path+'/':'') + f.name);
      const ext = (f.name||p).split('.').pop().toLowerCase();
      return {
        name: f.name || p.split('/').pop(),
        path: p,
        type: f.type || (['mp4','webm','mov','m4v'].includes(ext) ? 'video' : 'image'),
        poster: f.poster || null,
        size: f.size || 0
      };
    }),
    folders: []
  };
  n.folders = (node.folders||[]).map(c=>normalise(c, (n.path? n.path+'/':'')+ (c.name||''))).filter(Boolean);
  n.folders.forEach(c=>c.parent=n);
  n.total = n.files.length + n.folders.reduce((a,c)=>a+c.total,0);
  return n;
}

/* ---------------- tree ---------------- */
function buildTree(){
  const host=$('tree'); host.innerHTML='';
  host.appendChild(nodeEl(ROOT, 0));
  $('tree-count').textContent = ROOT.total + (ROOT.total===1?' item':' items');
}
function nodeEl(node, depth){
  const el=document.createElement('div');
  el.className='node'+(depth>0?' closed':'');
  el.dataset.path=node.path;
  const hasKids=node.folders.length>0;
  const row=document.createElement('button');
  row.className='row';
  row.innerHTML=`<span class="car${hasKids?'':' leaf'}">▼</span>
    <span class="fi">${ICON.folder}</span>
    <span class="nm">${esc(node.name)}</span>
    <span class="ct">${node.total||''}</span>`;
  row.addEventListener('click',()=>{
    if(hasKids && CUR===node) el.classList.toggle('closed');
    else el.classList.remove('closed');
    open(node);
  });
  el.appendChild(row);
  if(hasKids){
    const kids=document.createElement('div'); kids.className='kids';
    node.folders.forEach(c=>kids.appendChild(nodeEl(c, depth+1)));
    el.appendChild(kids);
  }
  return el;
}

/* ---------------- folder view ---------------- */
function open(node){
  CUR=node;
  LIST=node.files;
  document.querySelectorAll('.node').forEach(n=>n.classList.toggle('on', false));
  document.querySelectorAll('.row').forEach(r=>r.classList.remove('on'));
  const el=[...document.querySelectorAll('.node')].find(n=>n.dataset.path===node.path);
  if(el){
    el.querySelector('.row').classList.add('on');
    for(let p=el.parentElement; p; p=p.parentElement){
      if(p.classList && p.classList.contains('node')) p.classList.remove('closed');
    }
  }
  crumbs(node);
  $('count').textContent = `${node.files.length} file${node.files.length===1?'':'s'}`
    + (node.folders.length ? ` · ${node.folders.length} folder${node.folders.length===1?'':'s'}` : '');

  const fol=$('folders'); fol.innerHTML='';
  node.folders.forEach(c=>{
    const b=document.createElement('button');
    b.className='fcard';
    b.innerHTML=`${ICON.open}${esc(c.name)}<span>${c.total}</span>`;
    b.addEventListener('click',()=>open(c));
    fol.appendChild(b);
  });

  const grid=$('grid'); grid.innerHTML='';
  node.files.forEach((f,i)=>grid.appendChild(tile(f,i)));
  if(!node.files.length && !node.folders.length){
    grid.innerHTML=`<p style="color:#a1a9b1;font-size:12.5px;grid-column:1/-1;">This folder is empty.</p>`;
  }
  $('grid-wrap').scrollTop=0;
  closeSide();
}
function crumbs(node){
  const chain=[]; for(let n=node;n;n=n.parent) chain.unshift(n);
  const c=$('crumb'); c.innerHTML='';
  chain.forEach((n,i)=>{
    if(i) c.insertAdjacentHTML('beforeend','<i>/</i>');
    if(i===chain.length-1) c.insertAdjacentHTML('beforeend',`<b>${esc(n.name)}</b>`);
    else{
      const b=document.createElement('button');
      b.textContent=n.name; b.addEventListener('click',()=>open(n));
      c.appendChild(b);
    }
  });
}
function tile(f,i){
  const b=document.createElement('button');
  b.className='tile'; b.title=f.name;
  if(f.type==='video'){
    b.innerHTML=`<video src="${url(f.path)}#t=0.1" preload="metadata" muted playsinline
        ${f.poster?`poster="${url(f.poster)}"`:''}></video>
      <span class="badge">${ICON.play}MP4</span>
      <span class="cap">${esc(f.name)}</span>`;
  }else{
    b.innerHTML=`<img src="${url(f.path)}" alt="${esc(f.name)}" loading="lazy" decoding="async">
      <span class="cap">${esc(f.name)}</span>`;
  }
  const media=b.querySelector('img,video');
  media.addEventListener('error',()=>{
    media.remove();
    b.insertAdjacentHTML('afterbegin',`<span class="broken">missing<br>${esc(f.path)}</span>`);
  });
  b.addEventListener('click',()=>lightbox(i));
  return b;
}

/* ---------------- lightbox ---------------- */
function lightbox(i){
  if(!LIST.length) return;
  IDX=(i+LIST.length)%LIST.length;
  const f=LIST[IDX];
  const stage=$('lb-stage'); stage.innerHTML='';
  if(f.type==='video'){
    const v=document.createElement('video');
    v.src=url(f.path); v.controls=true; v.autoplay=true; v.playsInline=true; v.loop=false;
    if(f.poster) v.poster=url(f.poster);
    stage.appendChild(v);
  }else{
    const img=document.createElement('img');
    img.src=url(f.path); img.alt=f.name;
    stage.appendChild(img);
  }
  $('lb-name').innerHTML=`${esc(f.name)}<small>${esc(GALLERY_DIR+'/'+f.path)}</small>`;
  $('lb-n').textContent=`${IDX+1} / ${LIST.length}`;
  $('lb-open').onclick=()=>window.open(url(f.path),'_blank','noopener');
  $('lb').classList.add('open');
  document.querySelectorAll('#lb-nav button').forEach(b=>b.style.display=LIST.length>1?'grid':'none');
}
function closeLB(){
  $('lb').classList.remove('open');
  $('lb-stage').innerHTML='';        // stops any playing video
}
$('lb-close').addEventListener('click',closeLB);
document.querySelector('#lb-nav .prev').addEventListener('click',()=>lightbox(IDX-1));
document.querySelector('#lb-nav .next').addEventListener('click',()=>lightbox(IDX+1));
$('lb-stage').addEventListener('click',e=>{ if(e.target===$('lb-stage')) closeLB(); });
document.addEventListener('keydown',e=>{
  if(!$('lb').classList.contains('open')) return;
  if(e.key==='Escape') closeLB();
  if(e.key==='ArrowLeft') lightbox(IDX-1);
  if(e.key==='ArrowRight') lightbox(IDX+1);
});

/* ---------------- folder tree: drawer on mobile, collapsible on desktop ------ */
const SIDE_KEY='vv.gallery.side';
const wide=()=>window.innerWidth>760;

function closeSide(){ $('side').classList.remove('open'); $('scrim').classList.remove('on'); }
function setCollapsed(on){
  $('app').classList.toggle('collapsed',on);
  $('side-toggle').classList.toggle('off',on);
  $('side-toggle').setAttribute('aria-expanded',String(!on));
  try{ localStorage.setItem(SIDE_KEY,on?'0':'1'); }catch(e){}
}
$('side-toggle').addEventListener('click',()=>{
  if(wide()) setCollapsed(!$('app').classList.contains('collapsed'));
  else{
    const on=$('side').classList.toggle('open');
    $('scrim').classList.toggle('on',on);
  }
});
$('scrim').addEventListener('click',closeSide);
try{ if(localStorage.getItem(SIDE_KEY)==='0') setCollapsed(true); }catch(e){}
addEventListener('resize',()=>{ if(wide()) closeSide(); });

/* ---------------- failure ---------------- */
function showMessage(err){
  $('grid-wrap').style.display='none';
  $('bar').style.display='none';
  $('msg').classList.add('show');
  const local = location.protocol==='file:';
  $('msg').innerHTML=`
    <h3>No gallery manifest</h3>
    <p>${local
      ? 'This page reads its folder tree from a JSON file, and browsers block that on <b>file://</b> pages. Serve the folder over http instead:'
      : `Couldn't read <b>${esc(MANIFEST)}</b>. Generate it from your <b>${esc(GALLERY_DIR)}/</b> folder:`}</p>
    <div class="code">${local ? 'python3 -m http.server 8000' : 'python3 tools/build_gallery.py'}</div>
    <p class="mono" style="font-size:11px;color:#6c757c;">${esc(err.message||err)}</p>`;
}
</script>
</body>
</html>
